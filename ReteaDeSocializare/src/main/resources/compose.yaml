services:
  mysql_db:
    image: mysql:8.4
    container_name: retea-de-socializare-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: retea_de_socializare_api
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped


  retea-de-socializare:
    image: flavius14/retea-de-socializare-api:1.0.0
    container_name: retea-de-socializare-api
    environment:
      DB_URL: jdbc:mysql://mysql-db:3306/retea_de_socializare_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    ports:
      - "8082:8082"
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy

volumes:
  mysql_data:




